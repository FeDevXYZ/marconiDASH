<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/static/style.css">
  <meta charset="UTF-8">
  <title>marconiDASH</title>
</head>
<body>
<div class="main">
  <div class="container">
    <!-- <p id="data-debug"></p> used only for debug -->
    <div class="container-voice">
      <div class="voice">
          <h1>CPU</h1>
          <div style="margin-bottom: 8px">
              <h3>Total usage percent</h3>
              <h2 id="cpu-usage">99%</h2>
          </div>
          <div style="margin-top: 0">
              <h3>Usage per core</h3>
              <ul id="cpu-usage-percore">
              </ul>
          </div>
      </div>
      <div class="voice1">
        <div class="voice2">
          <div>
            <h1>RAM</h1>
            <div style="margin-bottom: 8px">
              <h3>Total usage percent</h3>
              <h2 id="ram-usage">99%</h2>
            </div>
          </div>
          <div style="display: flex; flex-direction: row; width: 100%; justify-content: center; margin-bottom: 20px">
              <div class="stat">
                <h3 style="margin-bottom: 0; margin-top: 0">Available</h3>
                <h3 id="ram-available" style="margin-top: 0;">6,3 GB</h3>
              </div>
            <div class="stat">
              <h3 style="margin-bottom: 0; margin-top: 0">Usage</h3>
              <h3 id="ram-used" style="margin-top: 0;">6,3 GB</h3>
            </div>
              <div class="stat" style="border:none">
                <h3 style="margin-bottom: 0; margin-top: 0">Total</h3>
                <h3 id="ram-total" style="margin-top: 0">7 GB</h3>
              </div>
          </div>
        </div>
        <div class="voice2">
          <div>
            <h1>SWAP</h1>
            <div style="margin-bottom: 8px">
              <h3>Total usage percent</h3>
              <h2>99%</h2>
            </div>
          </div>
          <div style="display: flex; flex-direction: row; width: 100%; justify-content: center; margin-bottom: 20px">
            <div class="stat">
              <h3 style="margin-bottom: 0; margin-top: 0">Available</h3>
              <h3 style="margin-top: 0;">6,3 GB</h3>
            </div>
            <div class="stat">
              <h3 style="margin-bottom: 0; margin-top: 0">Used</h3>
              <h3 style="margin-top: 0">1,7 GB</h3>
            </div>
            <div class="stat" style="border: none">
              <h3 style="margin-bottom: 0; margin-top: 0">Total</h3>
              <h3 style="margin-top: 0">7 GB</h3>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
    async function updateData() {
        const r = await fetch("http://localhost:5000/data") // TESTING PURPOSES, CHANGE IN PRODUCTION
        const j = await r.json()

        const [load1, load5, load15] = j.cpu.loadavg // CPU LOAD AVERAGE
        const {count: count, frequency: frequency, notlogical: notlogical} = j.cpu // CPU
        const {general: cpupercent, percore: cpupercent_percore} = j.cpu.percent // CPU
        const disk = j.disk
        const {readbytes: readMB, writebytes: writeMB } = j.disk
        const {available: ramavailable, percent: rampercent, total: ramtotal} = j.memory.ram
        const ramused = ramtotal - ramavailable
        const {free: swapavailable, percent: swappercent, total: swaptotal, used: swapused} = j.memory.swap
        const {bytes_rec: received, bytes_sent: sent} = j.net
        const system = j.system

        // Set text for every data
        // document.getById() statements and vars
        const p_cpupercent = document.getElementById("cpu-usage")
        const p_cpupercentxcore = document.getElementById("cpu-usage-percore")

        const p_rampercent = document.getElementById("ram-usage")
        const p_ramavailable = document.getElementById("ram-available")
        const p_ramused = document.getElementById("ram-used")
        const p_ramtotal = document.getElementById("ram-total")

        // set paragraph text
        p_cpupercent.textContent = cpupercent
        const fmt = n => n.toFixed(2).padStart(5, "0")
        cpupercent_percore.forEach(p => {
            p_cpupercentxcore.innerHTML = cpupercent_percore.map((percent, i) =>
                `<li>Core ${i+1}: ${fmt(percent)}%</li>`
            ).join("")
        });

        p_rampercent.textContent = rampercent
        p_ramavailable.textContent = ramavailable+" GB"
        p_ramused.textContent = ramused.toFixed(2).padStart(4, "0")+" GB"
        p_ramtotal.textContent = ramtotal+" GB"

    }

    updateData()
    setInterval(updateData, 1000)
</script>
</body>
</html>
