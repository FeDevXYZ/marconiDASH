<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/static/style.css">
  <meta charset="UTF-8">
  <title>marconiDASH</title>
</head>
<body>
<div class="main">
  <div class="container">
    <!-- <p id="data-debug"></p> used only for debug -->
    <div class="container-voice">
      <div class="voice">
          <h1>CPU</h1>
          <div style="margin-bottom: 8px">
              <h3>Total usage percent</h3>
              <h2 id="cpu-usage">99%</h2>
          </div>
          <div style="margin-top: 0">
            <h3 id="cpu-frequency">Frequency: 0 MHz</h3>
              <h3 id="usage-xcore">Usage per core</h3>
              <ul id="cpu-usage-percore">
              </ul>
          </div>
        <progress id="cpu-progress" value="0" max="100"></progress>
      </div>
      <div class="voice1">
        <div class="voice2">
          <div>
            <h1>RAM</h1>
            <div style="margin-bottom: 8px">
              <h3>Total usage percent</h3>
              <h2 id="ram-usage">99%</h2>
            </div>
          </div>
          <div>
            <div style="display: flex; flex-direction: row; width: 100%; justify-content: center; margin-bottom: 20px">
              <div class="stat">
                <h3 style="margin-bottom: 0; margin-top: 0">Available</h3>
                <h3 id="ram-available" style="margin-top: 0;">6,3 GB</h3>
              </div>
              <div class="stat">
                <h3 style="margin-bottom: 0; margin-top: 0">Usage</h3>
                <h3 id="ram-used" style="margin-top: 0;">6,3 GB</h3>
              </div>
              <div class="stat" style="border:none">
                <h3 style="margin-bottom: 0; margin-top: 0">Total</h3>
                <h3 id="ram-total" style="margin-top: 0">7 GB</h3>
              </div>
            </div>
            <progress id="ram-progress" value="0" max="100"></progress>
          </div>
        </div>
        <div class="voice2">
          <div>
            <h1>SWAP</h1>
            <div style="margin-bottom: 8px">
              <h3>Total usage percent</h3>
              <h2 id="swap-percent">99%</h2>
            </div>
          </div>
          <div>
            <div style="display: flex; flex-direction: row; width: 100%; justify-content: center; margin-bottom: 20px">
              <div class="stat">
                <h3 style="margin-bottom: 0; margin-top: 0">Available</h3>
                <h3 id="swap-available" style="margin-top: 0;">6,3 GB</h3>
              </div>
              <div class="stat">
                <h3 style="margin-bottom: 0; margin-top: 0">Used</h3>
                <h3 id="swap-used" style="margin-top: 0">1,7 GB</h3>
              </div>
              <div class="stat" style="border: none">
                <h3 style="margin-bottom: 0; margin-top: 0">Total</h3>
                <h3 id="swap-total" style="margin-top: 0">7 GB</h3>
              </div>
            </div>
            <progress id="swap-progress" value="0" max="100"></progress>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
    // document.getById() statements and vars
    const p_cpupercent = document.getElementById("cpu-usage")
    const p_cpupercentxcore = document.getElementById("cpu-usage-percore")
    const pr_cpu = document.getElementById("cpu-progress")
    const p_cpuxcore = document.getElementById("usage-xcore")
    const p_cpufrequency = document.getElementById("cpu-frequency")

    const p_rampercent = document.getElementById("ram-usage")
    const p_ramavailable = document.getElementById("ram-available")
    const p_ramused = document.getElementById("ram-used")
    const p_ramtotal = document.getElementById("ram-total")
    const pr_ram = document.getElementById("ram-progress")

    const p_swappercent = document.getElementById("swap-percent")
    const p_swapavailable = document.getElementById("swap-available")
    const p_swapused = document.getElementById("swap-used")
    const p_swaptotal = document.getElementById("swap-total")
    const pr_swap = document.getElementById("swap-progress")

    async function updateData() {
        const r = await fetch("/data")
        const j = await r.json()

        const [load1, load5, load15] = j.cpu.loadavg // CPU LOAD AVERAGE
        const {count: count, frequency: frequency, notlogical: notlogical} = j.cpu // CPU
        const {general: cpupercent, percore: cpupercent_percore} = j.cpu.percent // CPU
        const disk = j.disk
        const {readbytes: readMB, writebytes: writeMB } = j.disk
        const {available: ramavailable, percent: rampercent, total: ramtotal} = j.memory.ram
        const ramused = ramtotal - ramavailable
        const {free: swapavailable, percent: swappercent, total: swaptotal, used: swapused} = j.memory.swap
        const {bytes_rec: received, bytes_sent: sent} = j.net
        const system = j.system

        // Set text for every paragraph
        p_cpupercent.textContent = cpupercent
        p_cpufrequency.textContent = `Frequency: ${frequency} MHz`
        p_cpuxcore.textContent = `Usage per core  (${count} cores, ${notlogical} not logical)`
        const fmt = n => n.toFixed(2).padStart(5, "0")
        cpupercent_percore.forEach(p => {
            p_cpupercentxcore.innerHTML = cpupercent_percore.map((percent, i) =>
                `<li>Core ${i+1}: ${fmt(percent)}%</li>`
            ).join("")
        });
        pr_cpu.value = parseFloat(cpupercent.replace("%", "")) // Momentary fix. When the important fix below is applied, this can be done even easier by cpupercent var

        p_rampercent.textContent = rampercent // IMPORTANT FIX: Python needs to pass integers without the % to facilitate progress bar render
        p_ramavailable.textContent = ramavailable+" GB"
        p_ramused.textContent = ramused.toFixed(2).padStart(4, "0")+" GB"
        p_ramtotal.textContent = ramtotal+" GB"
        pr_ram.value = parseFloat(rampercent.replace("%", ""))

        p_swappercent.textContent = swappercent
        p_swapavailable.textContent = swapavailable+" GB"
        p_swapused.textContent = swapused+" GB"
        p_swaptotal.textContent = swaptotal+" GB"
        pr_swap.value = parseFloat(swappercent.replace("%", ""))
    }

    updateData()
    setInterval(updateData, 1000)
</script>
</body>
</html>
