<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/static/style.css">
  <meta charset="UTF-8">
  <title>marconiDASH</title>
</head>
<body>
<div class="main">
  <div class="container">
    <p id="data-debug"></p> <!-- used only for debug -->
    <div class="voice">
        <h1>CPU</h1>
        <div style="margin-bottom: 8px">
            <h3>Total usage percent</h3>
            <h2>99%</h2>
        </div>
        <div style="margin-top: 0">
            <h3>Usage per core</h3>
            <ul id="cpu-usage">
                <li>Core 1: 76%</li>
                <li>Core 2: 65%</li>
                <li>Core 3: 38%</li>
                <li>Core 4: 35%</li>
                <li>Core 5: 18%</li>
                <li>Core 6: 84%</li>
                <li>Core 7: 70%</li>
                <li>Core 8: 13%</li>
            </ul>
        </div>

    </div>
  </div>
</div>
<script>
    const data_debug = document.getElementById("data-debug")

    async function updateData() {
        const r = await fetch("/data")
        const j = await r.json()
        data_debug.textContent = JSON.stringify(j, null, 2)

        const [load1, load5, load15] = j.cpu.loadavg
        const {count: count, frequency: frequency, notlogical: notlogical, percent, cpupercent} = j.cpu
        const {available: ramavailable, percent: rampercent, total: ramtotal} = j.memory.ram
        const {free: swapavailable, percent: swappercent, total: swaptotal, used: swapused} = j.memory.swap
        const system = j.system
    }

    updateData()
    setInterval(updateData, 5000)
</script>
</body>
</html>
